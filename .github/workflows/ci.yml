name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  core-and-local-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:postgres:m01
      - run: pnpm test:postgres:m02
      - run: pnpm test:postgres:m03
      - run: pnpm test:postgres:m05
      - run: docker pull alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
      - run: pnpm test:sandbox:docker
      - run: pnpm test:sandbox:output
      - run: docker pull chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
      - run: pnpm test:storage:seaweedfs
